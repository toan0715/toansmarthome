<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Toan Smart Home - Internet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: #08070d;
      background-image:
        radial-gradient(circle at 75% 18%, rgba(112, 82, 224, 0.28) 0%, rgba(18, 15, 32, 0) 48%),
        radial-gradient(circle at 20% 78%, rgba(88, 66, 185, 0.14) 0%, rgba(8, 7, 13, 0) 50%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-bottom: 32px;
    }
    .app { width: 100%; max-width: 440px; padding: 18px 18px 12px; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
    .wifi-indicator { display: flex; align-items: center; gap: 8px; }
    .wifi-led-svg { width: 38px; height: 38px; flex-shrink: 0; }
    .wifi-led-label { font-size: 12.5px; font-weight: 600; line-height: 1.2; color: #22e53b; text-align: center; }
    .wifi-indicator.offline .wifi-led-label { color: #fbbf24; }

    .weather-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 22px;
      padding: 0 2px;
    }
    .weather-left { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .weather-icon-wrap { width: 64px; height: 52px; display: flex; align-items: center; justify-content: center; }
    .weather-temp { font-size: 36px; font-weight: 600; line-height: 1.05; letter-spacing: -1px; }
    .weather-cond { font-size: 15px; color: #d8d8e2; margin-top: 3px; }
    .weather-divider { width: 1px; height: 58px; background: rgba(255, 255, 255, 0.22); flex-shrink: 0; }
    .weather-meta { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: #e4e4ec; min-width: 0; flex: 1; }
    .meta-row { display: flex; align-items: center; gap: 6px; line-height: 1.25; }
    .meta-icon { width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .loc-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 112px; }
    .clock-box {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 15px;
      font-weight: 600;
      color: #f4f4fa;
      flex-shrink: 0;
    }

    .relay-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 20px; }
    .relay-card {
      background: linear-gradient(155deg, rgba(36, 35, 44, 0.92) 0%, rgba(23, 22, 29, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 22px;
      padding: 14px 15px 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 126px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .relay-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
    .relay-icon-box { width: 72px; height: 54px; display: flex; align-items: center; justify-content: flex-start; cursor: pointer; }

    .switch { position: relative; display: inline-block; width: 50px; height: 28px; flex-shrink: 0; margin-top: 2px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #36363f; transition: 0.25s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: #ffffff; transition: 0.25s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
    input:checked + .slider { background-color: #5b5ce6; }
    input:checked + .slider:before { transform: translateX(22px); }

    .relay-title { font-size: 16px; font-weight: 500; color: #f3f3f7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .master-btn {
      width: 100%;
      background: linear-gradient(90deg, #4b4ce0 0%, #6162f0 50%, #5253e6 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 15px 22px;
      color: #ffffff;
      font-size: 16.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(84, 85, 232, 0.38);
    }
    .master-btn-center { display: flex; align-items: center; gap: 11px; }
    .status-note { text-align: center; font-size: 12px; color: #9e9eb0; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Toan Smart Home</h1>
      <div class="wifi-indicator offline" id="wifiIndicator">
        <svg class="wifi-led-svg" viewBox="0 0 44 44" fill="none">
          <defs>
            <radialGradient id="ledGlowGreen" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#4ADE80" stop-opacity="0.9"/>
              <stop offset="55%" stop-color="#22C55E" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="ledGlowWarn" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#FACC15" stop-opacity="0.9"/>
              <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <circle id="ledHalo" cx="22" cy="22" r="20" fill="url(#ledGlowWarn)"/>
          <g id="ledRays" stroke="#FACC15" stroke-width="2" stroke-linecap="round">
            <line x1="22" y1="3" x2="22" y2="7"/><line x1="22" y1="37" x2="22" y2="41"/>
            <line x1="3" y1="22" x2="7" y2="22"/><line x1="37" y1="22" x2="41" y2="22"/>
            <line x1="8.5" y1="8.5" x2="11.5" y2="11.5"/><line x1="32.5" y1="32.5" x2="35.5" y2="35.5"/>
            <line x1="35.5" y1="8.5" x2="32.5" y2="11.5"/><line x1="11.5" y1="32.5" x2="8.5" y2="35.5"/>
          </g>
          <circle id="ledRing" cx="22" cy="22" r="10.5" fill="#D97706" stroke="#FDE047" stroke-width="1.5"/>
          <circle cx="22" cy="22" r="4.5" fill="#FFFFFF"/>
        </svg>
        <div class="wifi-led-label" id="wifiLedText">Đang chờ<br>Cloud</div>
      </div>
    </div>

    <div class="weather-hero">
      <div class="weather-left">
        <div class="weather-icon-wrap">
          <svg width="62" height="52" viewBox="0 0 68 56" fill="none">
            <circle cx="26" cy="21" r="11.5" fill="#FACC15"/>
            <g stroke="#FACC15" stroke-width="2.4" stroke-linecap="round">
              <line x1="26" y1="4" x2="26" y2="7.5"/><line x1="26" y1="34.5" x2="26" y2="38"/>
              <line x1="9" y1="21" x2="12.5" y2="21"/><line x1="39.5" y1="21" x2="43" y2="21"/>
              <line x1="14" y1="9" x2="16.5" y2="11.5"/><line x1="35.5" y1="30.5" x2="38" y2="33"/>
              <line x1="38" y1="9" x2="35.5" y2="11.5"/><line x1="16.5" y1="30.5" x2="14" y2="33"/>
            </g>
            <path d="M22 48h28a10 10 0 0 0 1.4-19.9A13.5 13.5 0 0 0 25.5 23 9.5 9.5 0 0 0 22 48z" fill="url(#cloudGrad)"/>
            <defs>
              <linearGradient id="cloudGrad" x1="35" y1="18" x2="35" y2="48" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#CBD5E1"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <div class="weather-temp" id="weatherTemp">28°C</div>
          <div class="weather-cond" id="weatherCond">Có mây</div>
        </div>
      </div>

      <div class="weather-divider"></div>

      <div class="weather-meta">
        <div class="meta-row">
          <span class="meta-icon">
            <svg width="13" height="15" viewBox="0 0 16 18" fill="#E4E4EC">
              <path d="M8 0.5A5.8 5.8 0 0 0 2.2 6.3c0 4.3 5.8 11.2 5.8 11.2s5.8-6.9 5.8-11.2A5.8 5.8 0 0 0 8 0.5zm0 8a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4z"/>
            </svg>
          </span>
          <span class="loc-text" id="locationText">Hà Nội</span>
        </div>
        <div class="meta-row">
          <span class="meta-icon">
            <svg width="13" height="14" viewBox="0 0 16 16" fill="none" stroke="#E4E4EC" stroke-width="1.5">
              <rect x="2" y="3" width="12" height="11" rx="2"/><line x1="2" y1="6.5" x2="14" y2="6.5"/>
              <line x1="5.5" y1="1.5" x2="5.5" y2="4"/><line x1="10.5" y1="1.5" x2="10.5" y2="4"/>
            </svg>
          </span>
          <span id="dateText">Th 7, 21/11/2026</span>
        </div>
        <div class="meta-row">
          <span class="meta-icon">
            <svg width="12" height="15" viewBox="0 0 14 18" fill="#E4E4EC">
              <path d="M7 1C7 1 1.5 7.8 1.5 12a5.5 5.5 0 0 0 11 0C12.5 7.8 7 1 7 1z"/>
            </svg>
          </span>
          <span id="outdoorHumText">Độ ẩm: 72%</span>
        </div>
      </div>

      <div class="clock-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E4E4EC" stroke-width="2">
          <circle cx="12" cy="12" r="9"></circle>
          <polyline points="12 7 12 12 15.5 14"></polyline>
        </svg>
        <span id="clockText">10:22</span>
      </div>
    </div>

    <div class="relay-grid" id="relayGrid"></div>

    <button class="master-btn" id="masterBtn" onclick="toggleAll()">
      <span style="width:18px;"></span>
      <span class="master-btn-center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
          <line x1="12" y1="2" x2="12" y2="12"></line>
        </svg>
        <span id="masterBtnText">Tắt tất cả thiết bị</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
    <div class="status-note" id="cloudNote">Điều khiển từ xa qua Internet (Firebase)</div>
  </div>

  <script>
    const DB_ROOT = "https://toan-smarthome-7ca3e-default-rtdb.asia-southeast1.firebasedatabase.app/toansmarthome";

    const DEFAULT_NAMES = ["Biển LED", "Bóng điện 1", "Phòng Khách", "Quạt", "Phòng Ăn", "Bàn làm việc"];
    let currentRelays = [false, false, false, false, false, false];
    let currentNames = [...DEFAULT_NAMES];
    let anyOn = false;

    function getDeviceSvg(idx, isOn) {
      switch (idx) {
        case 0:
          return `<svg width="68" height="48" viewBox="0 0 68 48" fill="none">
            <defs><radialGradient id="ceilBeam" cx="50%" cy="20%" r="75%"><stop offset="0%" stop-color="#FFFBEB" stop-opacity="${isOn ? '0.95' : '0.15'}"/><stop offset="55%" stop-color="#FDE047" stop-opacity="${isOn ? '0.45' : '0'}"/><stop offset="100%" stop-color="#FDE047" stop-opacity="0"/></radialGradient></defs>
            ${isOn ? '<ellipse cx="34" cy="27" rx="28" ry="18" fill="url(#ceilBeam)"/>' : ''}
            <ellipse cx="34" cy="16" rx="23" ry="8.5" fill="#1F2028" stroke="#6B7280" stroke-width="1.4"/>
            <ellipse cx="34" cy="17.5" rx="18" ry="6" fill="${isOn ? '#FFFDF0' : '#4B505C'}"/>
          </svg>`;
        case 1:
          return `<svg width="52" height="52" viewBox="0 0 52 52" fill="none">
            <defs><radialGradient id="bulbGlow" cx="50%" cy="42%" r="52%"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="${isOn ? '0.9' : '0'}"/><stop offset="100%" stop-color="#FEF08A" stop-opacity="0"/></radialGradient></defs>
            ${isOn ? '<circle cx="26" cy="21" r="21" fill="url(#bulbGlow)"/>' : ''}
            <path d="M26 5C17.2 5 10 12.2 10 21c0 5.8 3.1 10.9 7.8 13.7 1.4.8 2.2 2.3 2.2 3.9V40h12v-1.4c0-1.6.8-3.1 2.2-3.9C38.9 31.9 42 26.8 42 21 42 12.2 34.8 5 26 5z" fill="${isOn ? '#F8FAFC' : '#525663'}"/>
            <ellipse cx="21" cy="16" rx="3.4" ry="6.2" transform="rotate(-18 21 16)" fill="#FFFFFF" opacity="${isOn ? '0.85' : '0.2'}"/>
            <rect x="20.5" y="40" width="11" height="7" rx="2" fill="#9CA3AF"/>
          </svg>`;
        case 2:
          return `<svg width="68" height="48" viewBox="0 0 68 48" fill="none">
            <path d="M13 13a5 5 0 0 1 5-5h32a5 5 0 0 1 5 5v12H13V13z" fill="#D1D5DB"/>
            <line x1="34" y1="8" x2="34" y2="25" stroke="#9CA3AF" stroke-width="1.5"/>
            <rect x="7" y="18" width="8.5" height="15" rx="3.5" fill="#E5E7EB"/><rect x="52.5" y="18" width="8.5" height="15" rx="3.5" fill="#E5E7EB"/>
            <rect x="14" y="24" width="40" height="9" rx="3" fill="#F3F4F6"/>
            <rect x="14" y="33" width="3.5" height="7" rx="1.2" fill="#D97706"/><rect x="50.5" y="33" width="3.5" height="7" rx="1.2" fill="#D97706"/>
          </svg>`;
        case 3:
          return `<svg width="54" height="54" viewBox="0 0 54 54" fill="none">
            <circle cx="27" cy="21" r="16.5" stroke="${isOn ? '#BAE6FD' : '#6B7280'}" stroke-width="1.8" fill="rgba(14, 165, 233, ${isOn ? '0.12' : '0.03'})"/>
            <path d="M27 21L22 9.5C25 8 29 8 32 9.5L27 21Z" fill="${isOn ? '#38BDF8' : '#64748B'}"/>
            <path d="M27 21L38.5 25C38.5 28.5 36.4 31.5 33.4 33L27 21Z" fill="${isOn ? '#0EA5E9' : '#475569'}"/>
            <path d="M27 21L15.5 25C15.5 28.5 17.6 31.5 20.6 33L27 21Z" fill="${isOn ? '#7DD3FC' : '#94A3B8'}"/>
            <circle cx="27" cy="21" r="3.6" fill="#F8FAFC"/>
            <rect x="25" y="37.5" width="4" height="9" fill="#CBD5E1"/><ellipse cx="27" cy="47.5" rx="11" ry="3.2" fill="#E2E8F0"/>
          </svg>`;
        case 4:
          return `<svg width="68" height="48" viewBox="0 0 68 48" fill="none">
            <rect x="9" y="10" width="9" height="16" rx="2" fill="#D97706"/><rect x="50" y="10" width="9" height="16" rx="2" fill="#D97706"/>
            <rect x="19" y="21" width="30" height="4" rx="1.5" fill="#FBBF24"/><rect x="32.2" y="25" width="3.6" height="15" fill="#D97706"/>
            <rect x="10" y="25" width="2.6" height="15" fill="#B45309"/><rect x="16" y="25" width="2.6" height="15" fill="#B45309"/>
            <rect x="50" y="25" width="2.6" height="15" fill="#B45309"/><rect x="56" y="25" width="2.6" height="15" fill="#B45309"/>
          </svg>`;
        default:
          return `<svg width="62" height="52" viewBox="0 0 62 52" fill="none">
            <ellipse cx="24" cy="44" rx="12" ry="3.2" fill="#D97706"/>
            <path d="M24 43L32 25L22 13" stroke="#F59E0B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18 12L34 8L41 19L23 22L18 12Z" fill="#27272A" stroke="#71717A" stroke-width="1.4"/>
            <path d="M33 20.5L47 42H27L33 20.5Z" fill="#FDE047" opacity="${isOn ? '0.62' : '0.08'}"/>
          </svg>`;
      }
    }

    function setOnlineBadge(isOnline) {
      const box = document.getElementById("wifiIndicator");
      const halo = document.getElementById("ledHalo");
      const rays = document.getElementById("ledRays");
      const ring = document.getElementById("ledRing");
      const txt = document.getElementById("wifiLedText");
      if (isOnline) {
        box.classList.remove("offline");
        halo.setAttribute("fill", "url(#ledGlowGreen)");
        rays.setAttribute("stroke", "#22E53B");
        ring.setAttribute("fill", "#16A34A");
        ring.setAttribute("stroke", "#86EFAC");
        txt.innerHTML = "Online<br>Cloud";
      } else {
        box.classList.add("offline");
        halo.setAttribute("fill", "url(#ledGlowWarn)");
        rays.setAttribute("stroke", "#FACC15");
        ring.setAttribute("fill", "#D97706");
        ring.setAttribute("stroke", "#FDE047");
        txt.innerHTML = "Chờ kết<br>nối";
      }
    }

    async function sendCmd(cmdObj) {
      await fetch(`${DB_ROOT}/cmd.json`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(cmdObj)
      });
      setTimeout(pullState, 700);
    }

    function toggleOne(idx) {
      sendCmd({ setCh: idx, setState: !currentRelays[idx] });
    }

    function toggleAll() {
      sendCmd({ all: anyOn ? 0 : 1 });
    }

    function renderState(s) {
      if (!s) return;
      setOnlineBadge(Boolean(s.online));
      if (typeof s.weatherTemp === "number") document.getElementById("weatherTemp").innerText = `${Math.round(s.weatherTemp)}°C`;
      if (s.weatherDesc) document.getElementById("weatherCond").innerText = s.weatherDesc;
      if (s.location) document.getElementById("locationText").innerText = s.location;
      if (s.dateStr) document.getElementById("dateText").innerText = s.dateStr;
      if (typeof s.weatherHum === "number") document.getElementById("outdoorHumText").innerText = `Độ ẩm: ${s.weatherHum}%`;
      if (s.clockHm) document.getElementById("clockText").innerText = s.clockHm;
      if (s.ip) document.getElementById("cloudNote").innerText = `ESP32 IP: ${s.ip} • Đồng bộ Firebase`;

      currentRelays = Array.isArray(s.relays) ? s.relays.slice(0, 6) : currentRelays;
      currentNames = Array.isArray(s.names) && s.names.length === 6 ? s.names : currentNames;

      const grid = document.getElementById("relayGrid");
      grid.innerHTML = "";
      let onCount = 0;

      currentRelays.forEach((isOn, idx) => {
        if (isOn) onCount++;
        const card = document.createElement("div");
        card.className = "relay-card";
        card.innerHTML = `
          <div class="relay-top">
            <div class="relay-icon-box" onclick="toggleOne(${idx})">${getDeviceSvg(idx, isOn)}</div>
            <label class="switch">
              <input type="checkbox" ${isOn ? "checked" : ""} onchange="toggleOne(${idx})">
              <span class="slider"></span>
            </label>
          </div>
          <div class="relay-title">${currentNames[idx] || DEFAULT_NAMES[idx]}</div>`;
        grid.appendChild(card);
      });

      anyOn = onCount > 0;
      document.getElementById("masterBtnText").innerText = anyOn ? "Tắt tất cả thiết bị" : "Bật tất cả thiết bị";
    }

    async function pullState() {
      try {
        const res = await fetch(`${DB_ROOT}/state.json`);
        if (res.ok) {
          const data = await res.json();
          if (data) renderState(data);
        }
      } catch (e) {}
    }

    pullState();
    setInterval(pullState, 1500);
  </script>
</body>
</html>
