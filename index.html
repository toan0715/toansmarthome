<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Toan Smart Home - Cloud</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: #08070d;
      background-image:
        radial-gradient(circle at 75% 18%, rgba(112, 82, 224, 0.28) 0%, rgba(18, 15, 32, 0) 48%),
        radial-gradient(circle at 20% 78%, rgba(88, 66, 185, 0.14) 0%, rgba(8, 7, 13, 0) 50%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-bottom: 36px;
    }
    .app { width: 100%; max-width: 440px; padding: 18px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header h1 { font-size: 24px; font-weight: 700; }
    .status-pill {
      font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
      background: rgba(34, 197, 94, 0.16); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.35);
    }
    .status-pill.offline {
      background: rgba(251, 191, 36, 0.16); color: #fbbf24; border-color: rgba(251, 191, 36, 0.35);
    }
    .relay-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 18px; }
    .relay-card {
      background: linear-gradient(155deg, rgba(36, 35, 44, 0.92) 0%, rgba(23, 22, 29, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 22px;
      padding: 16px; display: flex; flex-direction: column; justify-content: space-between; min-height: 112px;
    }
    .relay-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .state-label { font-size: 12px; font-weight: 600; color: #9e9eb0; }
    .state-label.on { color: #818cf8; }
    .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #36363f; transition: 0.25s; border-radius: 34px; }
    .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 3px; bottom: 3px; background-color: #fff; transition: 0.25s; border-radius: 50%; }
    input:checked + .slider { background-color: #5b5ce6; }
    input:checked + .slider:before { transform: translateX(22px); }
    .relay-title { font-size: 15.5px; font-weight: 500; color: #f3f3f7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .master-btn {
      width: 100%; background: linear-gradient(90deg, #4b4ce0 0%, #6162f0 100%);
      border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 999px;
      padding: 14px 20px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .hint { margin-top: 14px; font-size: 12px; color: #9e9eb0; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>Toan Smart Home</h1>
      <div class="status-pill offline" id="cloudStatus">Đang kết nối...</div>
    </div>

    <div class="relay-grid" id="relayGrid"></div>

    <button class="master-btn" id="masterBtn" onclick="toggleAll()">Tắt tất cả thiết bị</button>
    <div class="hint" id="hintText">Project: toan-smarthome-7ca3e • Điều khiển qua Internet</div>
  </div>

  <script>
    const FIREBASE_DB_URL = "https://toan-smarthome-7ca3e-default-rtdb.asia-southeast1.firebasedatabase.app";
    const NODE_URL = `${FIREBASE_DB_URL}/toansmarthome`;
    const NUM_RELAYS = 8;

    const DEFAULT_NAMES = [
      "Biển LED", "Bóng điện 1", "Phòng Khách", "Quạt",
      "Phòng Ăn", "Bàn làm việc", "Máy bơm nước", "Camera"
    ];

    let relays = Array(NUM_RELAYS).fill(false);
    let names = [...DEFAULT_NAMES];
    let isUpdating = false;

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.innerText = s;
      return d.innerHTML;
    }

    function render() {
      const grid = document.getElementById("relayGrid");
      grid.innerHTML = "";
      let anyOn = false;

      relays.forEach((st, idx) => {
        if (st) anyOn = true;
        const card = document.createElement("div");
        card.className = "relay-card";
        card.innerHTML = `
          <div class="relay-top">
            <span class="state-label ${st ? "on" : ""}">${st ? "ĐANG BẬT" : "ĐANG TẮT"}</span>
            <label class="switch">
              <input type="checkbox" ${st ? "checked" : ""} onchange="toggleOne(${idx})">
              <span class="slider"></span>
            </label>
          </div>
          <div class="relay-title">${escapeHtml(names[idx] || ("Relay " + (idx + 1)))}</div>
        `;
        grid.appendChild(card);
      });

      document.getElementById("masterBtn").innerText = anyOn ? "Tắt tất cả thiết bị" : "Bật tất cả thiết bị";
      document.getElementById("masterBtn").dataset.next = anyOn ? "0" : "1";
    }

    async function pushRelays() {
      isUpdating = true;
      try {
        await fetch(`${NODE_URL}/relays.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(relays)
        });
      } finally {
        setTimeout(() => { isUpdating = false; }, 600);
      }
    }

    async function toggleOne(idx) {
      relays[idx] = !relays[idx];
      render();
      await pushRelays();
    }

    async function toggleAll() {
      const nextVal = document.getElementById("masterBtn").dataset.next === "1";
      relays = Array(NUM_RELAYS).fill(nextVal);
      render();
      await pushRelays();
    }

    async function pollFirebase() {
      if (isUpdating) return;
      const pill = document.getElementById("cloudStatus");
      try {
        const res = await fetch(`${NODE_URL}.json`);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        pill.className = "status-pill";
        pill.innerText = "Cloud Online";

        if (data && Array.isArray(data.relays)) {
          for (let i = 0; i < NUM_RELAYS; i++) {
            relays[i] = Boolean(data.relays[i]);
          }
        }
        if (data && Array.isArray(data.names)) {
          for (let i = 0; i < NUM_RELAYS; i++) {
            if (data.names[i]) names[i] = String(data.names[i]);
          }
        }
        render();
      } catch (err) {
        pill.className = "status-pill offline";
        pill.innerText = "Mất kết nối Cloud";
      }
    }

    render();
    pollFirebase();
    setInterval(pollFirebase, 1500);
  </script>
</body>
</html>
